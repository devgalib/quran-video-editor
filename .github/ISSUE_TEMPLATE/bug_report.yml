name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error message or log
      description: The text from the app's Log tab, or the terminal output. The chunk `.log` files in `.qve-tmp` help too (run with `--keep-temp`).
      render: text
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: App version (`qve --help` or the release name) and FFmpeg version (`ffmpeg -version`, first line)
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How do you run it?
      options: [Desktop app download, Desktop app from source, Command line, MCP server]
