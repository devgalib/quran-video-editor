name: Release

# Push a tag like v0.2.0 to build the desktop app for Windows, Linux and macOS
# and publish it, with the Python package, as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[gui]" pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name QuranVideoEditor
          --paths . --collect-data qve --collect-submodules qve
          --exclude-module mcp --exclude-module qve.mcp_server --exclude-module qve.__main__
          packaging/launcher.py
      - name: Add read-me and licences
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then dest=dist; else dest=dist/QuranVideoEditor; fi
          cp LICENSE "$dest/"
          cp packaging/RELEASE-README.txt "$dest/README.txt"
          mkdir -p "$dest/font-licenses" && cp qve/fonts/OFL-*.txt "$dest/font-licenses/"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/QuranVideoEditor -DestinationPath QuranVideoEditor-${{ matrix.name }}.zip
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf QuranVideoEditor-${{ matrix.name }}.tar.gz QuranVideoEditor
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -qry ../QuranVideoEditor-${{ matrix.name }}.zip QuranVideoEditor.app LICENSE README.txt font-licenses
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}
          path: QuranVideoEditor-*

  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/

  publish:
    needs: [app, python-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: artifacts/*
